name: Validar site

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Validar estrutura e arquivos
        run: python tools/validar_site.py

      - name: Validar sintaxe JavaScript
        shell: bash
        run: |
          for arquivo in js/*.js; do
            node --check "$arquivo"
          done
