<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Veja registros das ações do Mulheres na Computação.">
  <title>Galeria | Mulheres na Computação MNC</title>
  <link rel="icon" type="image/png" href="../imagens/logos/favicon.png">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/paginas/galeria.css">
  <script src="../js/core/theme-preload.js"></script>
  <script type="module" src="../js/main.js"></script>
</head>
<body data-page="gallery">
  <div id="circuitOverlay" aria-hidden="true">
    <canvas id="circuitCanvas"></canvas>
  </div>
  <div class="global-pattern" aria-hidden="true"></div>
  <header id="main-header" data-include="header.html"></header>
  <main id="conteudo" tabindex="-1">
<section class="gallery-section">
      <div class="gallery-bg-shape-1"></div>
      <div class="gallery-bg-shape-2"></div>

      <div class="gallery-banner reveal">
        <span class="overline gallery-overline">Memórias</span>
        <h1>Galeria do <span>Mulheres na Computação</span></h1>
        <p>Diga Xis! Vem pra galeria do MNC!<br>Dá uma olhada no que a gente anda aprontando ;D</p>
      </div>

      <div class="filtros-galeria reveal" id="container-filtros" role="group" aria-label="Filtrar fotos por categoria"></div>

      <div class="timeline-vertical" id="container-timeline">
        <p id="loading-galeria" class="gallery-message" role="status">Carregando memórias...</p>
      </div>

    </section>
  </main>
  <footer id="main-footer" class="site-footer" data-include="footer.html"></footer>
</body>
</html>
