<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipe | Mulheres na Computação MNC</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/paginas/equipe.css">
  <!-- Inicialização do tema para evitar Flash of Unstyled Content (FOUC) -->
  <script>(function(){const s=localStorage.getItem('mnc-theme')||'dark';document.documentElement.setAttribute('data-theme',s);})();</script>
</head>
<body>
  <div id="circuitOverlay" aria-hidden="true">
    <canvas id="circuitCanvas"></canvas>
  </div>

  <div class="global-pattern" aria-hidden="true"></div>

  <!-- O Header será injetado dinamicamente pelo main.js -->
  <header id="main-header"></header>

  <main>
    <section class="team-section">
      <div class="team-bg-shape-1"></div>
      <div class="team-bg-shape-2"></div>

      <div class="team-container">
        <div class="team-info-fixed reveal">
          <span class="overline">Pessoas</span>
          <h2>Equipe do<br><span>Mulheres na Computação</span></h2>
          <p>Vem conhecer a equipe que faz o projeto acontecer!</p>
          <div class="scroll-indicator">
            Role para ver todas
            <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div class="coord-chat-bubble">
            <div class="member-avatar chat-avatar" aria-hidden="true">L</div>
            <div class="chat-text">
              <p>Olá! Sou a <strong>Luciana</strong>, coordenadora do projeto. Vai fundo!</p>
            </div>
          </div>
          <a class="team-contact" href="mailto:mnc.uepb@gmail.com">Fale com a equipe</a>
        </div>

        <div class="team-grid-scroll">
          <article class="team-member reveal reveal-delay-1">
            <div class="member-avatar" aria-hidden="true">L</div>
            <h3>Luciana</h3>
            <p>Coordenadora</p>
          </article>

          <article class="team-member reveal reveal-delay-2">
            <div class="member-avatar" aria-hidden="true">S</div>
            <h3>Sinddy</h3>
          </article>

          <article class="team-member reveal reveal-delay-1">
            <div class="member-avatar" aria-hidden="true">J</div>
            <h3>Jasmine</h3>
          </article>

          <article class="team-member reveal reveal-delay-2">
            <div class="member-avatar" aria-hidden="true">S</div>
            <h3>Sonally</h3>
          </article>

          <article class="team-member reveal reveal-delay-3">
            <div class="member-avatar" aria-hidden="true">J</div>
            <h3>Julia</h3>
          </article>
        </div>
      </div>
    </section>

    <!-- O Footer será injetado dinamicamente pelo main.js -->
    <footer id="main-footer" class="site-footer"></footer>
  </main>

  <!-- Importação centralizada de todos os scripts da página -->
  <script type="module" src="../js/main.js"></script>
</body>
</html>
