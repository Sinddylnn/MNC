<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Conheça a equipe do projeto Mulheres na Computação.">
  <title>Equipe | Mulheres na Computação MNC</title>
  <link rel="icon" type="image/png" href="../imagens/logos/favicon.png">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/paginas/equipe.css">
  <script src="../js/core/theme-preload.js"></script>
  <script type="module" src="../js/main.js"></script>
</head>
<body data-page="team">
  <div id="circuitOverlay" aria-hidden="true">
    <canvas id="circuitCanvas"></canvas>
  </div>
  <div class="global-pattern" aria-hidden="true"></div>
  <header id="main-header" data-include="header.html"></header>
  <main id="conteudo" tabindex="-1">
<section class="team-section">
      <div class="team-bg-shape-1"></div>
      <div class="team-bg-shape-2"></div>

      <div class="team-container">
        <div class="team-info-fixed reveal">
          <span class="overline">Pessoas</span>
          <h1>Equipe do<br><span>Mulheres na Computação</span></h1>
          <p>Vem conhecer a equipe que faz o projeto acontecer!</p>
          <div class="scroll-indicator">
            Role para ver todas
            <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div class="coord-chat-bubble">
            <div class="member-avatar chat-avatar" aria-hidden="true"><img src="../imagens/equipe/luciana.png" alt="" decoding="async"></div>
            <div class="chat-text">
              <p>Olá! Sou a <strong>Luciana</strong>, coordenadora do projeto. Vai fundo!</p>
            </div>
          </div>
          <a class="team-contact" href="./quero-participar.html#contato">Fale com a equipe</a>
        </div>

        <div class="team-grid-scroll">
          <article class="team-member reveal reveal-delay-1">
            <div class="member-avatar" aria-hidden="true"><img src="../imagens/equipe/luciana.png" alt="" loading="lazy" decoding="async"></div>
            <h3>Luciana</h3>
            <p>Coordenadora</p>
          </article>

          <article class="team-member reveal reveal-delay-2">
            <div class="member-avatar" aria-hidden="true"><img src="../imagens/equipe/sinddy.jpg" alt="" loading="lazy" decoding="async"></div>
            <h3>Sinddy</h3>
          </article>

          <article class="team-member reveal reveal-delay-1">
            <div class="member-avatar" aria-hidden="true"><img src="../imagens/equipe/jasmine.png" alt="" loading="lazy" decoding="async"></div>
            <h3>Jasmine</h3>
          </article>

          <article class="team-member reveal reveal-delay-2">
            <div class="member-avatar" aria-hidden="true"><img src="../imagens/equipe/sonally.png" alt="" loading="lazy" decoding="async"></div>
            <h3>Sonally</h3>
          </article>

          <article class="team-member reveal reveal-delay-3">
            <div class="member-avatar" aria-hidden="true"><img src="../imagens/equipe/julia.jpg" alt="" loading="lazy" decoding="async"></div>
            <h3>Julia</h3>
          </article>

          <article class="team-member reveal reveal-delay-1">
            <div class="member-avatar" aria-hidden="true"><img src="../imagens/equipe/marcella.jpg" alt="" loading="lazy" decoding="async"></div>
            <h3>Marcella</h3>
          </article>

          <article class="team-member reveal reveal-delay-2">
            <div class="member-avatar" aria-hidden="true"><img src="../imagens/equipe/alice.png" alt="" loading="lazy" decoding="async"></div>
            <h3>Alice</h3>
          </article>
        </div>
      </div>
    </section>

  </main>
  <footer id="main-footer" class="site-footer" data-include="footer.html"></footer>
</body>
</html>
